<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22a77a" />
      <stop offset="1" stop-color="#0f7f63" />
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="transparent" />
      <circle cx="5" cy="5" r="1.2" fill="rgba(255,255,255,0.04)" />
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#08352b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- main rounded card -->
  <rect width="160" height="240" rx="12" ry="12" fill="url(#g)" />

  <!-- inner textured area -->
  <rect x="8" y="8" width="144" height="224" rx="10" ry="10" fill="url(#dots)" opacity="0.9" />

  <!-- subtle border highlight -->
  <rect x="6" y="6" width="148" height="228" rx="10" ry="10" fill="none" stroke="rgba(255,255,255,0.06)" />

  <!-- emblem -->
  <g transform="translate(80,120)" text-anchor="middle" filter="url(#soft)">
    <circle r="34" fill="rgba(255,255,255,0.06)" />
    <!-- small diamond -->
    <g fill="#ffffff" opacity="0.95" transform="translate(0,0)">
      <path d="M0,-10 L6,0 L0,10 L-6,0 Z" />
    </g>
  </g>

</svg>
